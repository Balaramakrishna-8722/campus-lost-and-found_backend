<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        /* Navigation added */
        nav {
            background-color: #1f4e79;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #163a5c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f4e79;
            text-decoration: none;
        }
    </style>
</head>

<body>

<!-- Navigation added -->
<nav>
    <a href="/">Home</a>
    <a href="/lost">Report Lost</a>
    <a href="/found">Report Found</a>
    <a href="/reports">View Reports</a>
    <a href="/admin/login">Admin Login</a>
</nav>

<div class="container">

    <h1>Report a Lost Item</h1>

    <form action="/lost" method="post">

        <label>Item Name:</label>

        <input
            type="text"
            name="itemName"
            placeholder="Example: Black Wallet"
            required>


        <label>Location Lost:</label>

        <input
            type="text"
            name="location"
            placeholder="Example: Library"
            required>


        <label>Description:</label>

        <textarea
            name="description"
            placeholder="Describe the item..."
            required></textarea>


        <label>Contact Information:</label>

        <input
            type="text"
            name="contact"
            placeholder="Email or phone number"
            required>


        <button type="submit">
            Submit Lost Item
        </button>

    </form>

    <a href="/" class="back">
        Back to Home
    </a>

</div>

</body>

</html>
