<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Campus Lost & Found</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #222;
        }

        header {
            background-color: #1f4e79;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 420px;
            margin: 60px auto;
            padding: 20px;
        }

        .login-card {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #163a5c;
        }

        .error {
            color: #c62828;
            text-align: center;
            margin-bottom: 15px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #1f4e79;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Campus Lost & Found</h1>
    <p>Administrator Login</p>
</header>

<div class="container">

    <div class="login-card">

        <h2>Admin Login</h2>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form action="/admin/login" method="post">

            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Enter username"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="back">
            <a href="/">Back to Home</a>
        </div>

    </div>

</div>

</body>
</html>
