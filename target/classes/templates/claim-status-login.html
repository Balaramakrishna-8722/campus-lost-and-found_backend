<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Claim Status - Campus Lost & Found</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #222;
        }

        header {
            background-color: #1f4e79;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        nav {
            margin-top: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        .status-box {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .status-box h2 {
            color: #1f4e79;
            margin-bottom: 20px;
        }

        .message {
            color: #555;
            line-height: 1.6;
        }

        .form-group {
            margin-top: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #1f4e79;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background-color: #163a5c;
        }

        .home-button {
            background-color: #555;
            margin-left: 10px;
        }

        .home-button:hover {
            background-color: #333;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

<header>

    <h1>Campus Lost & Found</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/lost">Report Lost</a>
        <a href="/found">Report Found</a>
        <a href="/reports">View Reports</a>
        <a href="/claim-status">Claim Status</a>
        <a href="/admin/login">Admin Login</a>
    </nav>

</header>


<div class="container">

    <div class="status-box">

        <h2>Claim Status</h2>

        <p class="message">
            Enter the claim status token you received after submitting your claim.
        </p>


        <form action="/claim-status" method="get">

            <div class="form-group">

                <label for="token">
                    Claim Status Token
                </label>

                <input
                    type="text"
                    id="token"
                    name="token"
                    placeholder="Enter your claim status token"
                    required>

            </div>


            <button type="submit" class="button">
                Check Claim Status
            </button>

        </form>


        <a href="/" class="button home-button">
            Home
        </a>

    </div>

</div>


<footer>

    <p>Campus Lost & Found System</p>

</footer>

</body>

</html>
